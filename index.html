<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 정보</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1><a href="index.html">영화 정보</a></h1>
    
    <form id="form">
        <input id="search" class="search" type="text" placeholder="찾기">
    </form>
    
</header>

<main id="main">
    <!-- 영화 리스트가 여기에 동적으로 추가됩니다 -->
</main>

<!-- 모달 -->
<div id="modal" class="modal">
    <div class="modalMain">
        <span class="close"></span>
        <img id="modalImage" src="#" alt="">
        <h3 id="movieTitle"></h3>
        <p id="movieContent"></p>
        <p><strong>평점 : </strong><span id="modalRating"></span></p>
        <p><strong>개봉일 : </strong><span id="modalDate"></span></p>
    </div>
</div>

<script src="javascript.js"></script>
</body>
</html>
